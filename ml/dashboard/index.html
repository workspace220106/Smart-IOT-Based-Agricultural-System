<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IOT Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F0;
    --surface: #FDFCF9;
    --border: #E6E2D9;
    --ink: #1A1A17;
    --muted: #6B6860;
    --faint: #A8A49A;
    --ok: #3F7D4F;
    --warn: #B5892B;
    --alert: #B04A3A;
    --accent: #2F5F8F;
    --radius: 2px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding: 48px 32px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
  }
  h1 { font-weight: 500; font-size: 20px; letter-spacing: -0.01em; }
  h1 span { color: var(--faint); font-weight: 300; margin-left: 8px; }
  .status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--faint);
  }
  .dot.live { background: var(--ok); box-shadow: 0 0 0 3px rgba(63,125,79,0.15); }

  h2 {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .grid { display: grid; gap: 24px; }
  .grid-2 { grid-template-columns: 1fr 1fr; }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 820px) {
    .grid-2, .grid-4 { grid-template-columns: 1fr; }
    body { padding: 24px 16px; }
  }

  section { margin-bottom: 48px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
  }
  .field label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }
  .field label span { color: var(--ink); font-family: 'JetBrains Mono', monospace; }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    background: var(--ink);
    border-radius: 50%;
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px;
    background: var(--ink);
    border-radius: 50%;
    border: none;
    cursor: pointer;
  }
  select, input[type="text"] {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    border-radius: var(--radius);
    outline: none;
  }
  select:focus, input[type="text"]:focus { border-color: var(--ink); }

  button {
    background: var(--ink);
    color: var(--surface);
    border: none;
    padding: 10px 20px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border-radius: var(--radius);
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.85; }
  button.ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--border);
  }

  /* Results */
  .result {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 16px;
    align-items: center;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    margin-bottom: 10px;
    font-size: 13px;
  }
  .result .marker {
    width: 3px; height: 32px; border-radius: 2px;
    background: var(--faint);
  }
  .result .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .result .value {
    font-weight: 500;
    color: var(--ink);
    margin-top: 2px;
  }
  .result .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .result.ok     .marker { background: var(--ok); }
  .result.warn   .marker { background: var(--warn); }
  .result.alert  .marker { background: var(--alert); }
  .result.info   .marker { background: var(--accent); }

  .result.ok    .value { color: var(--ok); }
  .result.warn  .value { color: var(--warn); }
  .result.alert .value { color: var(--alert); }
  .result.info  .value { color: var(--accent); }

  /* Chart */
  .chart { width: 100%; height: 160px; }
  .chart path.line { fill: none; stroke: var(--accent); stroke-width: 1.5; }
  .chart path.area { fill: var(--accent); fill-opacity: 0.06; stroke: none; }
  .chart line.grid { stroke: var(--border); stroke-width: 1; }
  .chart text { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: var(--muted); }

  /* Upload zone */
  .drop {
    border: 1px dashed var(--border);
    padding: 32px;
    text-align: center;
    border-radius: var(--radius);
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .drop:hover { border-color: var(--ink); }
  .drop input { display: none; }
  .drop p { color: var(--muted); font-size: 13px; }
  .drop .small { font-size: 11px; color: var(--faint); margin-top: 4px; }
  #preview {
    margin-top: 16px;
    max-width: 100%;
    max-height: 300px;
    border-radius: var(--radius);
    display: none;
  }

  footer {
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--faint);
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.04em;
  }

  .row { display: flex; gap: 8px; align-items: center; }
  .mt-8 { margin-top: 8px; }
  .mt-16 { margin-top: 16px; }
  .mt-24 { margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>IOT Lab <span>Smart Agriculture Dashboard</span></h1>
  <div class="status"><span id="dot" class="dot"></span><span id="apiStatus">Checking</span></div>
</header>

<section>
  <h2>Sensor Inputs</h2>
  <div class="card">
    <div class="grid grid-4">
      <div class="field">
        <label>Soil Moisture <span id="v_soil">35%</span></label>
        <input type="range" id="soil" min="0" max="100" value="35">
      </div>
      <div class="field">
        <label>Temperature <span id="v_temp">28°C</span></label>
        <input type="range" id="temp" min="-10" max="60" value="28">
      </div>
      <div class="field">
        <label>Humidity <span id="v_hum">65%</span></label>
        <input type="range" id="hum" min="0" max="100" value="65">
      </div>
      <div class="field">
        <label>pH <span id="v_ph">6.8</span></label>
        <input type="range" id="ph" min="0" max="14" step="0.1" value="6.8">
      </div>
      <div class="field">
        <label>TDS (ppm) <span id="v_tds">400</span></label>
        <input type="range" id="tds" min="0" max="2000" value="400">
      </div>
      <div class="field">
        <label>Turbidity <span id="v_turb">2.0</span></label>
        <input type="range" id="turb" min="0" max="100" step="0.1" value="2">
      </div>
      <div class="field">
        <label>Rainfall (mm) <span id="v_rain">0</span></label>
        <input type="range" id="rain" min="0" max="100" value="0">
      </div>
      <div class="field">
        <label>Crop</label>
        <select id="crop">
          <option>tomato</option><option>rice</option><option>wheat</option>
          <option>cotton</option><option>maize</option>
        </select>
      </div>
      <div class="field">
        <label>N <span id="v_n">40</span></label>
        <input type="range" id="N" min="0" max="200" value="40">
      </div>
      <div class="field">
        <label>P <span id="v_p">20</span></label>
        <input type="range" id="P" min="0" max="200" value="20">
      </div>
      <div class="field">
        <label>K <span id="v_k">30</span></label>
        <input type="range" id="K" min="0" max="200" value="30">
      </div>
      <div class="field" style="justify-content:flex-end;">
        <button id="run" class="mt-8">Run Analysis</button>
      </div>
    </div>
  </div>
</section>

<section>
  <h2>Analysis</h2>
  <div class="grid grid-2">
    <div class="card">
      <div id="results">
        <div class="result"><span class="marker"></span>
          <div><div class="label">Irrigation</div><div class="value">—</div></div>
          <div class="meta">pending</div></div>
        <div class="result"><span class="marker"></span>
          <div><div class="label">Fertilizer</div><div class="value">—</div></div>
          <div class="meta">pending</div></div>
        <div class="result"><span class="marker"></span>
          <div><div class="label">Water Quality</div><div class="value">—</div></div>
          <div class="meta">pending</div></div>
        <div class="result"><span class="marker"></span>
          <div><div class="label">Anomaly</div><div class="value">—</div></div>
          <div class="meta">pending</div></div>
      </div>
    </div>

    <div class="card">
      <div class="label" style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;">Soil Moisture — last 24 readings</div>
      <svg class="chart" id="chart" viewBox="0 0 400 160" preserveAspectRatio="none"></svg>
    </div>
  </div>
</section>

<section>
  <h2>Leaf Scan</h2>
  <div class="grid grid-2">
    <div class="card">
      <label class="drop" for="file">
        <input type="file" id="file" accept="image/*">
        <p id="dropText">Drop leaf image or click to select</p>
        <p class="small">JPG · PNG — any resolution</p>
      </label>
      <img id="preview">
      <div class="row mt-16">
        <select id="scanMode">
          <option value="disease">Disease</option>
          <option value="pest">Pest</option>
          <option value="health">Health</option>
        </select>
        <button id="scan" class="ghost">Scan</button>
      </div>
    </div>
    <div class="card">
      <div id="scanResult">
        <div class="result"><span class="marker"></span>
          <div><div class="label">Prediction</div><div class="value">—</div></div>
          <div class="meta">awaiting image</div></div>
      </div>
    </div>
  </div>
</section>

<footer>IOT Lab · Smart Agriculture · <span id="apiUrl"></span></footer>

</div>

<script>
const API = localStorage.getItem('API') || 'http://localhost:8000';
document.getElementById('apiUrl').textContent = API;

const sliders = ['soil','temp','hum','ph','tds','turb','rain','N','P','K'];
const unitMap = {soil:'%', temp:'°C', hum:'%', ph:'', tds:'', turb:'', rain:''};
sliders.forEach(id => {
  const el = document.getElementById(id);
  const out = document.getElementById('v_' + id.toLowerCase());
  if (!out) return;
  const update = () => out.textContent = el.value + (unitMap[id] || '');
  el.addEventListener('input', update); update();
});

function sensorBody() {
  return {
    soil_moisture: +soil.value, temperature: +temp.value, humidity: +hum.value,
    ph: +ph.value, tds: +tds.value, turbidity: +turb.value, rainfall: +rain.value,
    crop_type: crop.value, N: +N.value, P: +P.value, K: +K.value,
  };
}

function renderResult(label, value, tone, meta='') {
  return `<div class="result ${tone}"><span class="marker"></span>
    <div><div class="label">${label}</div><div class="value">${value}</div></div>
    <div class="meta">${meta}</div></div>`;
}

async function checkHealth() {
  try {
    const r = await fetch(API + '/health', { signal: AbortSignal.timeout(2000) });
    if (r.ok) { dot.classList.add('live'); apiStatus.textContent = 'Live'; return true; }
  } catch (e) {}
  apiStatus.textContent = 'Offline';
  return false;
}

async function callAPI(path, body) {
  const r = await fetch(API + path, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

document.getElementById('run').addEventListener('click', async () => {
  const b = sensorBody();
  const results = document.getElementById('results');
  results.innerHTML = renderResult('Irrigation','...','info','querying')
                    + renderResult('Fertilizer','...','info','querying')
                    + renderResult('Water Quality','...','info','querying')
                    + renderResult('Anomaly','...','info','querying');
  const [irr, fert, water, anom] = await Promise.allSettled([
    callAPI('/predict/irrigation', b),
    callAPI('/predict/fertilizer', b),
    callAPI('/predict/water', b),
    callAPI('/predict/anomaly', b),
  ]);
  const show = (r, name, formatter) => r.status === 'fulfilled'
    ? formatter(r.value)
    : renderResult(name, 'error', 'alert', r.reason?.message || '—');

  results.innerHTML =
    show(irr,  'Irrigation', v => renderResult('Irrigation', v.irrigate ? 'Irrigate now' : 'Hold', v.irrigate ? 'warn' : 'ok', (v.confidence*100).toFixed(1)+'% conf')) +
    show(fert, 'Fertilizer', v => renderResult('Fertilizer', v.recommendation, 'info', (v.confidence*100).toFixed(1)+'% conf')) +
    show(water,'Water Quality', v => {
      const tone = v.quality==='good' ? 'ok' : v.quality==='poor' ? 'alert' : 'warn';
      return renderResult('Water Quality', v.quality.charAt(0).toUpperCase()+v.quality.slice(1), tone);
    }) +
    show(anom, 'Anomaly', v => renderResult('Anomaly', v.is_anomaly ? 'Detected' : 'Normal', v.is_anomaly ? 'alert' : 'ok', 'score ' + v.score.toFixed(3)));
});

// --- Leaf scan ---
const fileInput = document.getElementById('file');
const preview = document.getElementById('preview');
fileInput.addEventListener('change', () => {
  if (!fileInput.files[0]) return;
  const url = URL.createObjectURL(fileInput.files[0]);
  preview.src = url; preview.style.display = 'block';
  document.getElementById('dropText').textContent = fileInput.files[0].name;
});
document.getElementById('scan').addEventListener('click', async () => {
  if (!fileInput.files[0]) return;
  const mode = document.getElementById('scanMode').value;
  const fd = new FormData(); fd.append('file', fileInput.files[0]);
  const result = document.getElementById('scanResult');
  result.innerHTML = renderResult('Prediction', '...', 'info', 'scanning');
  try {
    const r = await fetch(API + '/predict/' + mode, { method: 'POST', body: fd });
    const v = await r.json();
    const tone = v.label === 'healthy' || v.label === 'none' ? 'ok'
               : v.label === 'unknown' ? 'warn' : 'alert';
    result.innerHTML = renderResult(mode.charAt(0).toUpperCase()+mode.slice(1),
                                    v.label, tone, (v.confidence*100).toFixed(1)+'% conf');
  } catch (e) {
    result.innerHTML = renderResult('Prediction','error','alert', e.message);
  }
});

// --- Soil moisture sparkline (synthetic for demo) ---
function drawChart() {
  const svg = document.getElementById('chart');
  const pts = Array.from({length: 24}, (_,i) => 40 + 15 * Math.sin(i/3) + (Math.random()-0.5)*8);
  const W=400, H=160, pad=12;
  const xs = pts.map((_,i) => pad + i*(W-2*pad)/(pts.length-1));
  const min = Math.min(...pts), max = Math.max(...pts);
  const ys = pts.map(v => H - pad - (v-min)/(max-min+0.001) * (H-2*pad));
  const d = xs.map((x,i) => (i?'L':'M') + x.toFixed(1) + ',' + ys[i].toFixed(1)).join(' ');
  const area = `M${xs[0]},${H-pad} ${d.slice(1)} L${xs[xs.length-1]},${H-pad} Z`;
  const grid = [0.25, 0.5, 0.75].map(f => {
    const y = pad + f*(H-2*pad);
    return `<line class="grid" x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}"/>`;
  }).join('');
  svg.innerHTML = grid
    + `<path class="area" d="${area}"/>`
    + `<path class="line" d="${d}"/>`
    + `<text x="${pad}" y="${pad+4}">${max.toFixed(0)}%</text>`
    + `<text x="${pad}" y="${H-pad-2}">${min.toFixed(0)}%</text>`
    + `<text x="${W-pad-28}" y="${H-pad-2}">now</text>`;
}
drawChart();

checkHealth();
setInterval(checkHealth, 15000);
</script>
</body>
</html>
